name: Page Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Download state.json artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: state
      #     path: .
      #   continue-on-error: true
      - name: Clone state repo
        run: |
          git clone https://x-access-token:${{ secrets.STATE_REPO_TOKEN }}@github.com/mmmolin/page-watcher-state.git state-repo
          cp state-repo/state.json . || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Set EMAIL_PASSWORD env
        run: echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD}}" >> $GITHUB_ENV

      - name: Create config.yaml
        run: |
          echo "url: '${{ secrets.URL }}'" > config.yaml
          echo "to_email: '${{ secrets.TO_EMAIL }}'" >> config.yaml
          echo "from_email: '${{ secrets.FROM_EMAIL }}'" >> config.yaml
          echo "smtp_server: '${{ secrets.SMTP_SERVER }}'" >> config.yaml
          echo "smtp_port: ${{ secrets.SMTP_PORT }}" >> config.yaml
          echo "css_selector: '${{ secrets.CSS_SELECTOR }}'" >> config.yaml
          echo "sub_selector: '${{ secrets.SUB_SELECTOR }}'" >> config.yaml

      - name: Run watcher
        run: |
          source venv/bin/activate
          python main.py

      - name: Persist state back to state-repo (only commit if changed)
        if: always()
        run: |
          cp state.json state-repo/state.json || true
          cd state-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No changes to state.json"
          else
            git commit -m "Update state"
            git push
          fi
      # - name: Upload state.json artifact
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: state
      #     path: state.json